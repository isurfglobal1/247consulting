<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<!-- Favicons / App Icons -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="/favicon.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="96x96"
			href="/favicon-96x96.png" />
		<link
			rel="icon"
			href="/favicon.ico"
			sizes="any" />
		<link
			rel="apple-touch-icon"
			href="/apple-touch-icon.png" />
		<link
			rel="manifest"
			href="/site.webmanifest" />
		<meta
			name="msapplication-config"
			content="/browserconfig.xml" />

		<!-- Primary SEO Tags -->
		<title>247HR Consulting | Enterprise BPO & Workforce Solutions in Ethiopia</title>
		<meta
			name="title"
			content="247HR Consulting | Enterprise BPO & Workforce Solutions in Ethiopia" />
		<meta
			name="description"
			content="247HR Consulting, a subsidiary of ISurf Global, provides top-tier Business Process Outsourcing (BPO) solutions in Ethiopia. Streamline operations, enhance efficiency, and drive growth with our enterprise workforce infrastructure." />
		<meta
			name="keywords"
			content="BPO Ethiopia, Business Process Outsourcing Ethiopia, HR consulting Ethiopia, workforce solutions Ethiopia, enterprise operations Ethiopia, 247HR Consulting, ISurf Global subsidiary" />
		<meta
			name="author"
			content="247HR Consulting" />
		<meta
			name="robots"
			content="index, follow" />
		<meta
			name="googlebot"
			content="index, follow" />
		<meta
			name="revisit-after"
			content="7 days" />

		<!-- Open Graph / Social Media Meta Tags -->
		<meta
			property="og:type"
			content="website" />
		<meta
			property="og:url"
			content="https://247hr.com/" />
		<meta
			property="og:title"
			content="247HR Consulting | Enterprise BPO & Workforce Solutions in Ethiopia" />
		<meta
			property="og:description"
			content="Streamline your business operations with 247HR Consulting. Premier BPO solutions and workforce infrastructure for Ethiopian enterprises." />
		<meta
			property="og:image"
			content="https://247hr.com/og-image.png" />
		<meta
			property="og:image:width"
			content="1200" />
		<meta
			property="og:image:height"
			content="630" />
		<meta
			property="og:image:type"
			content="image/png" />
		<meta
			property="og:image:alt"
			content="247HR Consulting - BPO Solutions Ethiopia" />
		<meta
			property="og:site_name"
			content="247HR Consulting" />
		<meta
			property="og:locale"
			content="en_US" />

		<!-- Twitter Card Meta Tags -->
		<meta
			name="twitter:card"
			content="summary_large_image" />
		<meta
			name="twitter:url"
			content="https://247hr.com/" />
		<meta
			name="twitter:title"
			content="247HR Consulting | Enterprise BPO & Workforce Solutions in Ethiopia" />
		<meta
			name="twitter:description"
			content="Top-tier Business Process Outsourcing solutions for Ethiopian enterprises. Streamline operations and drive growth with 247HR Consulting." />
		<meta
			name="twitter:image"
			content="https://247hr.com/twitter-image.png" />
		<meta
			name="twitter:image:alt"
			content="247HR Consulting - BPO Solutions Ethiopia" />

		<!-- Additional SEO Meta Tags -->
		<meta
			name="application-name"
			content="247HR Consulting" />
		<meta
			name="apple-mobile-web-app-title"
			content="247HR" />
		<meta
			name="apple-mobile-web-app-capable"
			content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent" />
		<meta
			name="theme-color"
			content="#0A0A0A" />
		<meta
			name="format-detection"
			content="telephone=no" />

		<!-- Canonical URL -->
		<link
			rel="canonical"
			href="https://247hr.com/" />

		<!-- Language Alternates -->
		<link
			rel="alternate"
			href="https://247hr.com/"
			hreflang="en" />
		<link
			rel="alternate"
			href="https://247hr.com/am"
			hreflang="am" />
		<link
			rel="alternate"
			href="https://247hr.com/"
			hreflang="x-default" />

		<!-- Parent Company Relationship -->
		<link
			rel="parent-company"
			href="https://isurfglobal.com/" />

		<!-- Preconnect for Performance -->
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			rel="preconnect"
			href="https://images.unsplash.com" />

		<!-- Schema.org / Structured Data - Organization -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "247HR Consulting",
				"alternateName": "247HR",
				"url": "https://247hr.com/",
				"logo": "https://247hr.com/web-app-manifest-512x512.png",
				"description": "Top-tier Business Process Outsourcing (BPO) solutions provider in Ethiopia, helping businesses streamline operations, enhance efficiency, and drive growth.",
				"parentOrganization": {
					"@type": "Organization",
					"name": "ISurf Global",
					"url": "https://isurfglobal.com/"
				},
				"address": {
					"@type": "PostalAddress",
					"addressLocality": "Addis Ababa",
					"addressCountry": "Ethiopia"
				},
				"contactPoint": {
					"@type": "ContactPoint",
					"telephone": "+251XXXXXXXX",
					"contactType": "sales",
					"email": "executive@247hr.com"
				},
				"sameAs": ["https://www.linkedin.com/company/247hr"]
			}
		</script>

		<!-- Local Business Schema - Ethiopia -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "LocalBusiness",
				"name": "247HR Consulting",
				"image": "https://247hr.com/og-image.png",
				"@id": "https://247hr.com/",
				"url": "https://247hr.com/",
				"telephone": "+251XXXXXXXX",
				"email": "executive@247hr.com",
				"address": {
					"@type": "PostalAddress",
					"addressLocality": "Addis Ababa",
					"addressCountry": "ET"
				},
				"priceRange": "$$",
				"openingHoursSpecification": {
					"@type": "OpeningHoursSpecification",
					"dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
					"opens": "09:00",
					"closes": "18:00"
				}
			}
		</script>

		<!-- BPO Service Schema -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Service",
				"serviceType": "Business Process Outsourcing",
				"provider": {
					"@type": "Organization",
					"name": "247HR Consulting"
				},
				"areaServed": {
					"@type": "Country",
					"name": "Ethiopia"
				},
				"hasOfferCatalog": {
					"@type": "OfferCatalog",
					"name": "BPO Solutions",
					"itemListElement": [
						{
							"@type": "Offer",
							"itemOffered": {
								"@type": "Service",
								"name": "Executive Search"
							}
						},
						{
							"@type": "Offer",
							"itemOffered": {
								"@type": "Service",
								"name": "Workforce Infrastructure"
							}
						},
						{
							"@type": "Offer",
							"itemOffered": {
								"@type": "Service",
								"name": "Talent Analytics"
							}
						},
						{
							"@type": "Offer",
							"itemOffered": {
								"@type": "Service",
								"name": "Risk & Compliance"
							}
						}
					]
				}
			}
		</script>

		<!-- WebSite Schema -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "247HR Consulting",
				"url": "https://247hr.com/",
				"inLanguage": ["en", "am"],
				"potentialAction": {
					"@type": "SearchAction",
					"target": {
						"@type": "EntryPoint",
						"urlTemplate": "https://247hr.com/search?q={search_term_string}"
					},
					"query-input": "required name=search_term_string"
				}
			}
		</script>

		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				scroll-behavior: smooth;
			}
			#root {
				height: 100%;
			}
		</style>
	</head>

	<body>
		<div id="root"></div>
		<script
			type="module"
			src="/src/main.tsx"></script>
	</body>
</html>
